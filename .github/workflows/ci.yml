name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest

      - name: Compile pipeline script
        run: python3 -m py_compile scripts/compute_rookie_alpha.py

      - name: Run tests
        run: python3 -m pytest tests -q

      - name: Validate promoted 2026 export against manifest
        run: |
          python3 scripts/validate_promoted_export.py \
            --export-json exports/promoted/rookie-alpha/2026_rookie_alpha_predraft_v0.json \
            --manifest exports/promoted/rookie-alpha/2026_manifest.json

      - name: Validate promoted export integrity (all artifact families)
        run: python3 scripts/validate_promoted_integrity.py

      - name: Validate experimental export integrity (demoted ML lane)
        run: python3 scripts/validate_experimental_integrity.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run runtime smoke tests
        run: npm run test:runtime-smoke

      - name: Run card disclosure tests
        run: npm run test:card-disclosure

      - name: Run CSV export formula-injection tests
        run: npm run test:csv-export
